# Layout: full-width strip attached directly under waybar
anchor=top
width=294
lines=1
y-margin=0
layer=overlay

# Font & style (matches waybar)
font=monospace:bold:pixelsize=14
horizontal-pad=8
vertical-pad=4
inner-pad=4

# Colors
[colors]
background=222222ff
text=bbbbbbff
prompt=bbbbbbff
input=eeeeeeff
match=ffffffff
selection=005577ff
selection-text=eeeeeeff
selection-match=ffffffff

[border]
width=0
radius=0
