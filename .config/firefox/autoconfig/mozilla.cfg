// (first line of mozilla.cfg is always skipped)
// Ctrl+number tab switching, any number of digits.
//   Hold Ctrl, type 1 then 2, release Ctrl  -> tab 12
//   Ctrl+3 jumps at once when no tab 30+ exists (nothing to wait for)
//   Ctrl+0 on its own still resets zoom; Ctrl+1 Ctrl+0 -> tab 10
// Works while typing in pages too. Numbers match the userChrome.css tab numbers.
// Source: ~/.config/firefox/autoconfig/ (dotfiles); installed by install.sh.
try {
  const WAIT_MS = 800;   // time to type the next digit if Ctrl is kept held

  const setup = win => {
    if (!win.gBrowser || win.__ctrlTabNumber) return;
    win.__ctrlTabNumber = true;
    let num = "", timer = null;

    const tabs = () => win.gBrowser.visibleTabs;
    const go = () => {
      win.clearTimeout(timer); timer = null;
      if (!num) return;
      const n = parseInt(num, 10); num = "";
      const t = tabs()[n - 1];
      if (t) win.gBrowser.selectedTab = t;
    };

    win.addEventListener("keydown", e => {
      if (!e.ctrlKey || e.altKey || e.shiftKey || e.metaKey) return;
      const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code);
      if (!m) return;
      const d = m[1];
      if (d === "0" && !num) return;          // plain Ctrl+0 = reset zoom
      e.preventDefault();
      e.stopImmediatePropagation();
      num += d;
      win.clearTimeout(timer);
      if (parseInt(num, 10) * 10 > tabs().length) go();   // can't get longer
      else timer = win.setTimeout(go, WAIT_MS);
    }, true);

    win.addEventListener("keyup", e => {
      if ((e.key === "Control" || !e.ctrlKey) && num) go();
    }, true);
  };

  // every browser window, once its tab browser is ready
  Services.obs.addObserver(win => setup(win), "browser-delayed-startup-finished");
  for (const win of Services.wm.getEnumerator("navigator:browser")) setup(win);
} catch (err) {
  Components.utils.reportError("mozilla.cfg ctrl-tab-number: " + err);
}
