# Ultra-minimal Hyprland config - performance focused with red borders
# DWM-style: master-slave layout, red borders, minimal effects

# -----------------------------
# Monitor and Workspace Setup
# -----------------------------

monitor = eDP-1,1920x1200@60,2560x0,1
monitor = DP-1,3840x2160@60,0x0,1.5

# Assign workspaces to monitors
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1

exec-once = hyprctl dispatch dpms on eDP-1
exec-once = hyprctl dispatch focusmonitor eDP-1
exec-once = hyprctl dispatch dpms on DP-1
exec-once = hyprctl dispatch workspace 1

# Essential autostart
# exec-once = hyprpaper
exec-once = waybar
exec-once = obsidian --ozone-platform=wayland --enable-features=UseOzonePlatform

# Audio system fix for SOF device init
exec-once = sleep 1 && systemctl --user restart pipewire pipewire-pulse wireplumber

# -----------------
# App Launch Vars
# -----------------
$terminal = alacritty
$browser  = firefox
$notes_app  = obsidian --ozone-platform=wayland --enable-features=UseOzonePlatform
$todoist  = ~/.local/bin/public-scripts/todoist-wayland.sh
$mail     = ~/.local/bin/public-scripts/protonmail-wayland.sh
$calendar = ~/.local/bin/public-scripts/calendar-wayland.sh
$menu = ~/.local/bin/public-scripts/fuzzel-run-path

# -----------------
# General Settings
# -----------------
general {
    border_size        = 3
    gaps_in            = 5
    gaps_out           = 10
    col.active_border  = rgb(CF3838)
    col.inactive_border= rgb(C77777)
    layout             = master
    no_focus_fallback  = true
}

decoration {
    rounding           = 0
    dim_inactive       = false
    active_opacity     = 1.0
    inactive_opacity   = 1.0
}

animations {
    enabled            = false
}

input {
    follow_mouse       = 1
    sensitivity        = 0
    accel_profile      = flat

    kb_layout = us,dk
    kb_options = grp:alt_shift_toggle
}

master {
    orientation                = left
    mfact                      = 0.55
    allow_small_split          = false
    new_status                 = slave
    new_on_top                 = false
    new_on_active              = none
    smart_resizing             = true
    drop_at_cursor             = true
    always_keep_position       = false
#   center_master_slaves_on_right = true
    slave_count_for_center_master = 2
}

misc {
    disable_hyprland_logo      = true
    disable_splash_rendering   = true
    force_default_wallpaper    = 0
    vfr                        = true
    vrr                        = 1
    mouse_move_enables_dpms    = true
    key_press_enables_dpms     = true
}

# -----------------------------
# App-to-Workspace Assignments
# -----------------------------
windowrule = match:class ^(firefox)$, workspace 2
windowrule = match:class ^(Alacritty)$, workspace 1
windowrule = match:class ^(obsidian)$, workspace 3
windowrule = match:class ^(chrome-todoist\.com__-Default)$, tile on
windowrule = match:class ^(chrome-calendar\.proton\.me__-Default)$, tile on
windowrule = match:title ^(Proton Mail.*)$, tile on
windowrule = match:class ^(chrome-.*)$, tile on

# -----------------
# Keybindings
# -----------------
$mainMod = SUPER

# App launchers
bind = $mainMod SHIFT, Return, exec, $terminal
bind = $mainMod SHIFT, b, exec, $browser
bind = $mainMod SHIFT, n, exec, $notes_app
bind = $mainMod SHIFT, t, exec, sh -c 'hyprctl dispatch workspace 4 && sleep 0.3 && $todoist'
bind = $mainMod SHIFT, m, exec, sh -c 'hyprctl dispatch workspace 5 && sleep 0.3 && $mail'
bind = $mainMod SHIFT, c, exec, sh -c 'hyprctl dispatch workspace 6 && sleep 0.3 && $calendar'
bind = $mainMod, p, exec, $menu
bind = SUPER_SHIFT, P, exec, hyprpicker -a

# Keyboard layout toggle (US/Danish)
bind = $mainMod, grave, exec, hyprctl switchxkblayout at-translated-set-2-keyboard next
bind = $mainMod, grave, exec, hyprctl switchxkblayout keyd-virtual-keyboard next

# Window management
bind = $mainMod SHIFT, q, killactive
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r

# DWM-like window movement
bind = $mainMod SHIFT, j, layoutmsg, swapnext
bind = $mainMod SHIFT, k, layoutmsg, swapprev

# DWM-like resizing
bind = $mainMod SHIFT, h, splitratio, -0.05
bind = $mainMod SHIFT, l, splitratio, 0.05

bind = $mainMod, space, togglefloating
bind = $mainMod, Return, layoutmsg, swapwithmaster auto
bind = $mainMod, f, fullscreen

# Workspace switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Monitor switching
bind = $mainMod, comma, focusmonitor, -1
bind = $mainMod, period, focusmonitor, +1

# Move window between monitors
bind = $mainMod CTRL, h, movewindow, mon:-1
bind = $mainMod CTRL, l, movewindow, mon:+1
bind = $mainMod CTRL SHIFT, h, movecurrentworkspacetomonitor, -1
bind = $mainMod CTRL SHIFT, l, movecurrentworkspacetomonitor, +1

# Master layout tweaks
bind = $mainMod, m, layoutmsg, focusmaster
bind = $mainMod, t, layoutmsg, swapwithmaster auto
bind = $mainMod, n, layoutmsg, cyclenext
bind = $mainMod, b, layoutmsg, cycleprev
bind = $mainMod, u, layoutmsg, addmaster
bind = $mainMod, y, layoutmsg, removemaster
bind = $mainMod, r, layoutmsg, rollnext
bind = $mainMod SHIFT, r, layoutmsg, rollprev
bind = $mainMod, o, layoutmsg, orientationnext

# Audio control (PipeWire)
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Brightness control
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Exit Hyprland
bind = $mainMod SHIFT, x, exit

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# -----------------------------
# Clipboard bindings
# -----------------------------

# Auto-save clipboard changes
exec-once = wl-paste --type text --watch sh -c '~/.local/bin/public-scripts/cliphist add'
# Bind Super+V to open clipboard menu  
bind = SUPER, V, exec, ~/.local/bin/public-scripts/cliphist sel

# -----------------------------
# Screenshot bindings
# -----------------------------

# Fullscreen screenshot: SUPER + s
bind = $mainMod, s, exec, sh -c 'mkdir -p ~/pics/screenshots && FILE=~/pics/screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png && grim "$FILE" && cat "$FILE" | wl-copy --type image/png'

# Region screenshot: SUPER + SHIFT + s
bind = $mainMod SHIFT, s, exec, sh -c 'mkdir -p ~/pics/screenshots && FILE=~/pics/screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png && grim -g "$(slurp)" "$FILE" && cat "$FILE" | wl-copy --type image/png'

# Region + swappy: SUPER + SHIFT + e
bind = $mainMod SHIFT, e, exec, sh -c 'mkdir -p ~/pics/screenshots && FILE=~/pics/screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png && grim -g "$(slurp)" - | swappy -f - -o "$FILE" && cat "$FILE" | wl-copy --type image/png'
exec-once = dunst

# -----------------------------
# Custom window rules
# -----------------------------
windowrule = match:class ^(imv)$, float on
windowrule = match:class ^(imv)$, center on
exec-once = ~/.config/swaybg/launch.sh
