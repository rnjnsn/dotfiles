[env]
TERM = "alacritty"

[terminal.shell]
program = "/bin/bash"
args = ["-l", "-c", "tmux new-session -s $$"]

[window]
decorations = "none"
[window.padding]
x = 10
y = 10

[scrolling]
history = 10000
multiplier = 3

[font]
size = 22
builtin_box_drawing = true
[font.normal]
family = "UbuntuMono Nerd Font Mono"
style = "Regular"
[font.bold]
family = "UbuntuMono Nerd Font Mono"
style = "Bold"
[font.italic]
family = "UbuntuMono Nerd Font Mono"
style = "Italic"
[font.bold_italic]
family = "UbuntuMono Nerd Font Mono"
style = "Bold Italic"

[cursor]
style = "Block"

# Colors (Gruvbox dark)
# Default colors
[colors.primary]
# hard contrast background = = '#1d2021'
# background = "#282828"
background = '#32302f'
# soft contrast background = = '#32302f'
foreground = '#ebdbb2'

# Normal colors
[colors.normal]
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

# Bright colors
[colors.bright]
black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'

# Enable Vi Mode Toggle
[[keyboard.bindings]]
key = "V"
mods = "Control"
mode = "~Vi"
action = "ToggleViMode"

[bell]
animation = "EaseOutExpo"
duration = 150
color = "#FB4934"

# Vi Mode Navigation
[[keyboard.bindings]]
key = "J"
mode = "Vi"
action = "ScrollLineDown"

[[keyboard.bindings]]
key = "K"
mode = "Vi"
action = "ScrollLineUp"

[[keyboard.bindings]]
key = "G"
mode = "Vi"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "G"
mods = "Shift"
mode = "Vi"
action = "ScrollToBottom"

[[keyboard.bindings]]
key = "U"
mods = "Control"
mode = "Vi"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "D"
mods = "Control"
mode = "Vi"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "Y"
mode = "Vi"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mode = "Vi"
action = "ToggleNormalSelection"

[[keyboard.bindings]]
key = "Escape"
mode = "Vi"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "/"
mode = "Vi"
action = "SearchForward"

[[keyboard.bindings]]
key = "N"
mode = "Vi"
action = "SearchNext"

[[keyboard.bindings]]
key = "N"
mods = "Shift"
mode = "Vi"
action = "SearchPrevious"

# URL hints: Ctrl+Shift+U opens a link, Ctrl+Shift+Y copies one to the clipboard
[[hints.enabled]]
regex = "(www\\.|ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"
hyperlinks = true
post_processing = true
command = "/home/rene/.local/bin/public-scripts/open-url"
mouse.enabled = true
binding = { key = "U", mods = "Control|Shift" }

[[hints.enabled]]
regex = "(www\\.|ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"
hyperlinks = true
post_processing = true
action = "Copy"
binding = { key = "Y", mods = "Control|Shift" }
