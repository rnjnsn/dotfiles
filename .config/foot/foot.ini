# foot — ported from ~/.config/alacritty/alacritty.toml
# Main reason for foot: real (sixel) images inside the terminal, e.g. lf previews.

[main]
shell=/bin/bash -l -c "tmux new-session -s $$"
font=UbuntuMono Nerd Font Mono:size=22
pad=10x10

[scrollback]
lines=10000
multiplier=3

[cursor]
style=block

[bell]
visual=yes

[url]
# open-url adds https:// to bare www. links, which xdg-open can't open
launch=/home/rene/.local/bin/public-scripts/open-url ${url}

[key-bindings]
# Same as Alacritty: Ctrl+Shift+U opens a link, Ctrl+Shift+Y copies one.
# (Ctrl+Shift+U is foot's Unicode input by default, so that is moved off it.)
show-urls-launch=Control+Shift+u Control+Shift+o
show-urls-copy=Control+Shift+y
unicode-input=none

# Gruvbox dark (soft background), same as Alacritty
[colors-dark]
background=32302f
foreground=ebdbb2
regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984
bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2
