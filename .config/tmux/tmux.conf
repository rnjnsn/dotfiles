# Based on Rob Muhlestein's config (linktr.ee/rwxrob, public domain).
# Cleaned up 2026-11-19: duplicates removed, each option set once, in groups.
# Previous version: tmux.conf.bak-20261119. Docs: ~/notes/00_inbox/tmux-setup.md (moves to 70_reference after review)

# ---- terminal & shell ------------------------------------------------------
set -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,xterm-256color:RGB"
set -g focus-events on          # lets nvim notice focus (autoread, etc.)
set -g history-limit 10000
set -g mouse on

# ---- prefix ----------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a last-window            # double-tap prefix: last window
bind -n C-y send-prefix         # prefix for a nested tmux

# ---- sessions & popups -----------------------------------------------------
# f: pick a session or a zoxide directory (script: ~/.local/bin/public-scripts/tm)
bind f display-popup -E -w 70% -h 60% "~/.local/bin/public-scripts/tm"
# g: persistent scratch shell in a popup; press prefix g again to hide it
bind g if -F "#{==:#{session_name},scratch}" "detach-client" \
	"display-popup -E -w 80% -h 75% -d '#{pane_current_path}' 'env -u TMUX tmux new-session -A -s scratch'"
# e: lf file manager in a popup, starting in this pane's directory
bind e display-popup -E -w 80% -h 80% -d "#{pane_current_path}" lf

# ---- windows & panes -------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g allow-rename on
set -g automatic-rename on

bind | split-window -h
bind '\' split-window -h
bind 'C-\' split-window -h
bind - split-window -v
bind _ split-window -v
bind & kill-window
bind -r y setw synchronize-panes

set -g repeat-time 200          # short, so resizing does not swallow cursor keys
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r C-k resize-pane -U 1
bind -r C-j resize-pane -D 1
bind -r C-h resize-pane -L 1
bind -r C-l resize-pane -R 1

# new window with a narrow blank pane on the right
bind C-c new-window \; split-window -h \; select-pane -t 2 \; resize-pane -x 26 \; send-keys blankpane Enter \; select-pane -t 1

bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ---- copy mode -------------------------------------------------------------
setw -g mode-keys vi
set -g status-keys vi
set -s copy-command "wl-copy"
# Enter copies to the clipboard and also saves to /tmp/buf (for yyy/ppp)
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel \; save-buffer /tmp/buf
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel \; save-buffer /tmp/buf

# Ctrl+click opens the link under the mouse
bind -n C-MouseDown1Pane set-option -Fg @open_url_hl "#{mouse_hyperlink}" \; set-option -Fg @open_url_line "#{mouse_line}" \; set-option -Fg @open_url_x "#{mouse_x}" \; run-shell -b /home/rene/.local/bin/public-scripts/tmux-open-url

# ---- look ------------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "fg=#665c54"
set -g status-bg default
set -g status-left-length 30
set -g status-left "#[bold]#S "
set -g status-right-length 50
set -g status-right "#{?client_prefix,#[fg=yellow bold]PREFIX ,}"
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W*"
set -g message-style "fg=red"

set -g pane-border-style "fg=#171717"
# active border: yellow in copy mode, red while panes are synced, else green
set -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=green}}"
setw -g mode-style "noattr,bg=yellow,fg=black"

set -g clock-mode-style 12
set -g clock-mode-colour yellow
